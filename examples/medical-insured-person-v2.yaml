openapi: 3.1.0
info:
  title: Получение информации о застрахованных лицах
  description: |

    # Введение

    Стандарт содержит описания модели данных и конечных точек АPI, предназначенных для обмена данными между страховыми организациями и медицинскими организациями через Открытые программные интерфейсы.
    Информационный обмен между медицинской организацией и страховой организацией осуществляется посредством электронных сообщений, формируемых на стороне медицинской организации и на стороне страховой организации посредством Открытых данных.   

    ## Термины и определения

    В стандарте применяются термины и определения в соответствии с ФАПИ.СЕК, БФБО 1.8, СТО БР Открытые программные интерфейсы. Общие положения.

    ## Область применения

    Стандарт рекомендован к использованию организациями при обмене сообщениями, связанными с обменом данными между участниками финансового и нефинансового секторов в модели “Открытые данные”.
    Стандарт используется страховой организацией для разработки интерфейсов, которые они предоставляют для медицинской организацией.
    Стандарт используется медицинской организацией организации для реализации взаимодействий со страховой организацией через Открытые программные интерфейсы.

    Стандарт предназначен для:

      - участников получения публичной информации об услугах медицинских организаций (медицинские организации и их клиенты);
      - участников получения информации о застрахованных клиентах (страховые организации и их клиенты);
      - разработчиков информационного и программного обеспечения, информационных систем.  

    ### Положения настоящего стандарта применяются совместно со следующими документами:

      МР.26.2.002─2024. Методические рекомендации ТК 26. Информационная технология. Криптографическая защита информации. Использование российских криптографических алгоритмов в протоколах OpenID Connect (далее МР OIDC).
      СТО БР ФАПИ.СЕК-1.6-2024 Стандарт Банка России "Безопасность финансовых (банковских) операций. Прикладные программные интерфейсы обеспечения безопасности финансовых сервисов на основе протокола OpenID" (далее ФАПИ.СЕК).
      СТО БР Открытые программные интерфейсы. Общие положения.
      СТО БР Открытые программные интерфейсы. Глоссарий.
      СТО БР Открытые программные интерфейсы. Общие требования к прикладным стандартам.

    ### Принципы архитектуры
      За основу создания среды Открытых программных интерфейсов на основании отзывов участников рынка, а также согласно опыту мировых практик взят архитектурный стиль RESTful API , что позволяет создавать простые и понятные для взаимодействия API.
    ### Физический уровень описания сообщений
      На физическом уровне при проектировании сообщений используется язык описания интерфейсов `OpenAPI 3-й версии` в формате `YAML`.
    ### Управление версиями API
      Управление версиями API осуществляется согласно подходу `Semantic Versioning 2.0.0`.

    ## URI структура пути ресурса

    ### Путь ресурса URI должен соответствовать следующей структуре: 
      `[participant-path-prefix]/open-data]/[version]/[resource-group]/[resource]/[resource-id]`.
    ### URI cтруктура пути ресурса состоит из следующих элементов:
      - `[participant-path-prefix]` – необязательный префикс;
      - `open-data` – постоянное значение "open-data";
      - `[version]` – версия API, выраженная в виде /v[major-version].[minor-version]/;
      - `[resource-group]` - идентификатор группы конечных точек, в соответствии с ролью участника;
      - `[resource]/[resource-id]` – наименование ресурса и его идентификатор (например, /accounts/1112345678).


    Примеры:

    ~~~http
      https://example.ru/oapi-channel/open-data/v1.0/mfsp/insured-persons
    ~~~


    ## Общее описание процесса

    Данный раздел спецификации описывает последовательность взаимодействий между
    страховой компанией (СК) и медицинской организацией (МО) при передаче списка застрахованных лиц
    по договорам добровольного медицинского страхования (ДМС) через Открытые API.

    Обмен данными осуществляется в защищённой среде с применением TLS 1.2+/ГОСТ, mTLS
    и подписей JWS в соответствии с требованиями Приказа Минздрава РФ № 911н и Приказа ФСТЭК № 21.

    ### Диаграмма взаимодействия
    <img alt="Диаграмма процесса" src="static/openapi-images/insured-person-sequence.svg" />

    ### Последовательность взаимодействий

    #### Шаг 1. Callback-уведомление от СК
    **Описание:** СК уведомляет МО о готовности нового или изменённого списка застрахованных лиц.
    Передача выполняется через POST `/notifications/insured-persons` на сервер нотификаций МО.
    **Пример запроса:**
    ```http
    POST /notifications/insured-persons HTTP/1.1
    Host: notif.mo.example.ru
    Content-Type: application/json
    X-JWS-Signature: <Подпись JWS>
    Authorization: Bearer <access_token>

    {
      "link": "https://rs.sk.example.ru/open-data/v1.0/mfsp/insured-persons/ax-111-111111110",
      "insuredPersonId": "ax-111-111111110",
      "action": "Attachment",
      "createdAt": "2025-08-05T10:00:00Z"
    }
    ```

    #### Шаг 2. Получение access token МО
    **Описание:** МО запрашивает у СК токен доступа по OAuth 2.0 (grant_type=client_credentials, private_key_jwt ГОСТ)
    для вызова API `/insured-persons`.
    **Пример запроса:**
    ```http
    POST /as/aft/connect/token HTTP/1.1
    Host: as.sk.example.ru
    Content-Type: application/x-www-form-urlencoded

    grant_type=client_credentials&
    client_id=urn:uuid:97ed4827-7b6f-4491-a06f-b548d5a7512d&
    client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer&
    client_assertion=<JWT_подписанный_ГОСТ>&
    scope=insuredperson
    ```

    #### Шаг 3. Запрос МО к СК на получение списка ЗЛ
    **Описание:** МО, используя полученный access_token, запрашивает полный список застрахованных лиц
    по идентификатору, переданному в уведомлении.
    **Пример запроса:**
    ```http
    GET /open-data/v1.0/mfsp/insured-persons/ax-111-111111110 HTTP/1.1
    Host: rs.sk.example.ru
    Authorization: Bearer eyJhbGciOiJ...
    Accept: application/json
    x-fapi-interaction-id: 97ed4827-7b6f-4491-a06f-b548d5a7512d
    ```

    #### Шаг 4. Callback-уведомление от МО о статусе
    **Описание:** МО уведомляет СК о результате обработки списка (успешно, частично с ошибками).
    Формат соответствует схеме `InsuredPersonListProcessingStatus.yaml`.
    **Примеры:**

    - Все записи успешно обработаны:
      
    ```http
    POST /insured-persons/status HTTP/1.1
    Host: notif.sk.example.ru
    Content-Type: application/json
    X-JWS-Signature: <Подпись ГОСТ>
    ```
    
    ```json
    {
      "insuredPersonId": "7e2f9c8a-3b1d-4c2e-9d7a-8f6e2b1c4d5e",
      "status": "processed",
      "processedAt": "2025-06-27T16:10:00Z",
      "InsuredPersonSummary": {
        "totalRecords": 100,
        "acceptedRecords": 100,
        "rejectedRecords": 0
      }
    }
    ```

    - Часть записей с ошибками по застрахованным лицам:

    ```http
    POST /insured-persons/status HTTP/1.1
    Host: notif.sk.example.ru
    Content-Type: application/json
    X-JWS-Signature: <Подпись ГОСТ>
    ```
    ```json
    {
      "insuredPersonId": "7e2f9c8a-3b1d-4c2e-9d7a-8f6e2b1c4d5e",
      "status": "processed",
      "processedAt": "2025-06-27T16:10:00Z",
      "InsuredPersonSummary": {
        "totalRecords": 100,
        "acceptedRecords": 98,
        "rejectedRecords": 2
      },
      "InsuredPersonIssue": [
        {
          "seriesAndNumberDms": "DMS-0001-01-2025",
          "errorCode": "INVALID_SNILS",
          "message": "Некорректный формат СНИЛС"
        },
        {
          "seriesAndNumberDms": "DMS-0003-03-2025",
          "errorCode": "PROGRAM_NOT_FOUND",
          "message": "Указанная программа страхования не зарегистрирована в МО"
        }
      ]
    }
    ```

    - Отклонено целиком (ошибка верхнего уровня):

    ```http
    POST /insured-persons/status HTTP/1.1
    Host: notif.sk.example.ru
    Content-Type: application/json
    X-JWS-Signature: <Подпись ГОСТ>
    ```
    ```json
    {
      "insuredPersonId": "7e2f9c8a-3b1d-4c2e-9d7a-8f6e2b1c4d5e",
      "status": "rejected",
      "processedAt": "2025-06-27T16:10:00Z",
      "TopLevelIssues": [
        {
          "errorCode": "CONTRACT_MISMATCH",
          "message": "Договор ДМС не найден или не активен",
          "documentNumber": "DMS-12234-10\2023-F"
        }
      ],
      "InsuredPersonSummary": {
        "totalRecords": 100,
        "acceptedRecords": 0,
        "rejectedRecords": 100
      }
    }
    ```

    ## Безопасность и контроль доступа

    **Защищённые каналы связи** передача данных осуществляется по защищённым каналам (TLS 1.2+ или ГОСТ TLS) с обязательной взаимной аутентификацией (mTLS).<br>
    **Электронная подпись:** все сообщения подписываются в формате JWS с использованием алгоритмов ГОСТ, что гарантирует идентификацию отправителя и целостность передаваемых данных.<br>
    **Аутентификация и авторизация:** реализуются по протоколу OAuth 2.0 с применением механизма private_key_jwt и профиля client_credentials.<br>
    **Токен доступа:** каждый вызов к конечной точке API в среде Открытых программных интерфейсов должен содержать действительный токен доступа в заголовке HTTP Authorization: Bearer <access_token>.<br>
    **Получение токена:** Потребитель услуг (ПУ) передаёт свои учётные данные (client credentials) и проходит аутентификацию на конечной точке токена в соответствии с OAuth 2.0.<br>
    **Область действия токена:** токен доступа, используемый для работы с API, должен иметь область действия (scope) не менее insuredperson — для получения информации о застрахованных лицах.<br>
    **Соответствие нормативным требованиям:**
      - Приказ Минздрава РФ № 911н — в части защиты информации, соблюдения форматов и использования нормативно-справочной информации (НСИ) при обмене медицинскими данными;
      - Приказ ФСТЭК РФ № 21 — в части организационных и технических мер защиты персональных данных при их обработке в информационных системах персональных данных (ИСПДн);
      - МР OIDC.

    ## Идентификатор изменения ресурса 

      Медицинская организация может возвращать в заголовке HTTP уникальный идентификатор ресурса Etag, с помощью которого страховая организация может определять, изменился ли ресурс с момента последнего запроса.
  version: 1.2.2
  termsOfService: https://openbanking.ru/terms
  contact:
    name: Ассоциация развития финансовых технологий (Ассоциация ФинТех)
    url: https://fintechru.org
    email: info@fintechru.org
  license:
    name: open-licence
    url: https://openbankingrussia.ru
  x-logo:
    url: static/logo.svg
    altText: Открытые данные
    href: https://openbankingrussia.ru/
servers:
  - url: https://sb0.openbankingrussia.ru/sandbox0/open-banking/v1.0/mfsp
    description: Эмулятор Сервера Ресурсов Поставщика услуг Песочница 0
tags:
  - name: InsuredPerson - Список застрахованных лиц
    description: Содержание списка застрахованных лиц по договорам добровольного медицинского страхования
paths:
  /insured-persons:
    get:
      tags:
        - InsuredPerson - Список застрахованных лиц
      summary: Список застрахованных лиц по договорам добровольного медицинского страхования
      description: |-
        Конечная точка позволяет получить список застрахованных лиц по договорам добровольного медицинского страхования 
        <img alt="UML диаграмма" src="static/openapi-images/insured-person-v2.svg" />
      operationId: getInsuredPerson
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/If-Modified-Since'
        - $ref: '#/components/parameters/If-None-Match'
      responses:
        '200':
          $ref: '#/components/responses/200InsuredPerson'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - TPPInsuredPersonOAuth2Security:
            - insuredperson
    head:
      operationId: headInsuredPerson
      tags:
        - InsuredPerson - Список застрахованных лиц
      summary: Получение информации о заголовках HTTP
      description: |
        Получение информации о заголовках HTTP ресурса
        ППД может возвращать в заголовке HTTP уникальный идентификатор ресурса `Etag`,
        с помощью которого СППД может определить, изменился ли ресурс с момента последнего запроса. 
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/If-Modified-Since'
        - $ref: '#/components/parameters/If-None-Match'
      responses:
        '200':
          $ref: '#/components/responses/200Head'
        '304':
          $ref: '#/components/responses/304NotModified'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - TPPInsuredPersonOAuth2Security:
            - insuredperson
  /notifications/insured-persons:
    post:
      tags:
        - Notifications Callback
      summary: Callback-уведомление от СК к Серверу нотификаций о готовности списка застрахованных лиц
      description: |
        Страховая компания уведомляет медицинскую организацию о доступности списка застрахованных лиц по ДМС.
      operationId: notifyInsuredPersonListReady
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - insuredPersonId
                - actionWithInsuredPerson
                - createdAt
                - link
              properties:
                insuredPersonId:
                  type: string
                  format: uuid
                  description: Уникальный идентификатор списка застрахованных лиц
                actionWithInsuredPerson:
                  type: string
                  description: Действие с застрахованными лицами. Обязательное поле.
                  example: Attachment
                  enum:
                    - Attachment
                    - Detachment
                    - Changment
                  x-enum-descriptions:
                    - Прикрепление
                    - Открепление
                    - Изменение
                  x-enum-varnames:
                    - Attachment
                    - Detachment
                    - Changment
                createdAt:
                  type: string
                  format: date-time
                  description: Дата и время формирования пакета
                  example: '2025-06-27T11:20:00Z'
                link:
                  type: string
                  format: uri
                  description: Ссылка на список застрахованных лиц
                  example: https://sk.example.ru/api/insured-persons/abc1234-def-5678
      responses:
        '202':
          description: Уведомление успешно принято
        '400':
          description: Неверный формат уведомления
        '401':
          description: Неавторизованный запрос
        '403':
          description: Доступ запрещён
        '500':
          description: Внутренняя ошибка
      security:
        - TPPInsuredPersonOAuth2Security:
            - insuredperson
  /insured-persons/status:
    post:
      tags:
        - Notifications
      summary: Callback-уведомление от МО о статусе обработки списка застрахованных лиц
      description: |
        Медицинская организация подтверждает приём списка и отправляет информацию о статусе обработки в адрес страховой компании.
      operationId: notifyInsuredPersonProcessingStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsuredPersonListProcessingStatus'
            examples:
              allAccepted:
                summary: Все записи успешно обработаны
                value:
                  insuredPersonId: 7e2f9c8a-3b1d-4c2e-9d7a-8f6e2b1c4d5e
                  status: processed
                  processedAt: '2025-06-27T16:10:00Z'
                  InsuredPersonSummary:
                    totalRecords: 100
                    acceptedRecords: 100
                    rejectedRecords: 0
              partialWithErrors:
                summary: Часть записей отклонена
                value:
                  insuredPersonId: 7e2f9c8a-3b1d-4c2e-9d7a-8f6e2b1c4d5e
                  status: processed
                  processedAt: '2025-06-27T16:10:00Z'
                  InsuredPersonSummary:
                    totalRecords: 100
                    acceptedRecords: 98
                    rejectedRecords: 2
                  InsuredPersonIssue:
                    - seriesAndNumberDms: DMS-0001-01-2025
                      errorCode: INVALID_SNILS
                      message: Некорректный формат СНИЛС
                    - seriesAndNumberDms: DMS-0003-03-2025
                      errorCode: PROGRAM_NOT_FOUND
                      message: Указанная программа страхования не зарегистрирована в МО
              pending:
                summary: Обработка ещё выполняется
                value:
                  insuredPersonId: 7e2f9c8a-3b1d-4c2e-9d7a-8f6e2b1c4d5e
                  status: pending
                  processedAt: '2025-06-27T16:10:00Z'
                  InsuredPersonSummary:
                    totalRecords: 100
                    acceptedRecords: 0
                    rejectedRecords: 0
              rejectedAll:
                summary: Список отклонён целиком (ошибка верхнего уровня)
                value:
                  insuredPersonId: 7e2f9c8a-3b1d-4c2e-9d7a-8f6e2b1c4d5e
                  status: rejected
                  processedAt: '2025-06-27T16:10:00Z'
                  TopLevelIssues:
                    - errorCode: CONTRACT_MISMATCH
                      message: Договор ДМС не найден или не активен
                      documentNumber: DMS-12234-10\2023-F
                  InsuredPersonSummary:
                    totalRecords: 100
                    acceptedRecords: 0
                    rejectedRecords: 100
      responses:
        '202':
          description: Статус успешно зарегистрирован
        '400':
          description: Неверные данные
        '401':
          description: Неавторизованный запрос
        '403':
          description: Запрос отклонён
        '500':
          description: Внутренняя ошибка сервера
      security:
        - TPPInsuredPersonOAuth2Security:
            - insuredperson
components:
  securitySchemes:
    TPPInsuredPersonOAuth2Security:
      type: oauth2
      description: Сторонний поставщик использует поток авторизации сlient сredentional для доступа к ресурсам Поставщика услуг
      flows:
        clientCredentials:
          tokenUrl: https://sb0.openbankingrussia.ru/sandbox0/as/aft/connect/token
          scopes:
            insuredperson: возможность получать информацию о застрахованных лицах
  parameters:
    page:
      name: page
      in: query
      required: false
      description: Номер страницы
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 5000
        default: 1
    If-Modified-Since:
      in: header
      name: if-modified-since
      schema:
        type: string
        format: date-time
      required: false
      description: Фильтрации по времени модификации. Возвращает только те ресурсы, которые были изменены с указанного времени обращения
    If-None-Match:
      in: header
      name: if-none-match
      schema:
        type: string
        format: uuid
      required: false
      description: Фильтрации по идентификатору данных. Возвращает ресурс только в случае если представленное значение Etag не совпадает с текущим
    x-fapi-interaction-id:
      in: header
      name: x-fapi-interaction-id
      required: true
      description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
      schema:
        type: string
        format: uuid
        description: Универсальный уникальный идентификатор (UUID) версии 4, в соответствии с IETC RFC 4122 "Universally Unique IDentifier (UUID) URN Namespace".
      example: 97ed4827-7b6f-4491-a06f-b548d5a7512d
    x-fapi-customer-ip-address:
      in: header
      name: x-fapi-customer-ip-address
      schema:
        type: string
        minLength: 0
        maxLength: 21
        pattern: ^([0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|(\d{1,3}\.){3}\d{1,3}$
        example: 172.123.123.123
      required: false
      description: IP-адрес Пользователя, если Пользователь в данный момент подключен к Стороннему Поставщику (авторизован в приложении Стороннего Поставщика).
    x-customer-user-agent:
      in: header
      name: x-customer-user-agent
      schema:
        type: string
      description: В заголовке указывается тип устройства (user-agent), который использует Пользователь. Сторонний Поставщик может заполнить это поле значением типа устройства (user-agent), указанным Пользователем. Если Пользователь использует мобильное приложение Стороннего Поставщика, Сторонний Поставщик проверяет, что строка типа устройства (user-agent) отличается от строки типа устройства (user-agent) на основе браузера.
      required: false
      example: mobile
  schemas:
    Contractor:
      type: object
      description: Сведения об участнике факта хозяйственной жизни исполнителя
      additionalProperties: false
      required:
        - LegalEntity
      properties:
        LegalEntity:
          description: Сведения о юридическом лице - исполнителе
          type: object
          additionalProperties: false
          required:
            - organizationInn
            - organizationKpp
            - organizationName
            - organizationId
          properties:
            organizationId:
              description: Уникальный и неизменный идентификатор, используемый для идентификации ресурса организации - юридического лица
              type: string
              format: uuid
              example: b1c4efe2-6992-4794-a256-4094a259ec07
            organizationName:
              description: Полное наименование организации
              type: string
              pattern: ^[\w\W]{1,1000}$
              minLength: 1
              maxLength: 1000
              example: Общество с ограниченной ответственностью «Сеть медицинских клиник»
            organizationInn:
              description: ИННЮЛ
              type: string
              minItems: 1
              maxItems: 10
              pattern: ^[\w\W]{10}$
              example: '7728240000'
            organizationKpp:
              description: КПП
              type: string
              minItems: 1
              maxItems: 9
              pattern: ^[\w\W]{9}$
              example: '770201001'
    LegalEntity:
      description: Сведения о юридическом лице
      type: object
      additionalProperties: false
      required:
        - organizationInn
        - organizationName
        - organizationId
        - organizationKpp
      properties:
        organizationId:
          description: Уникальный и неизменный идентификатор, используемый для идентификации ресурса организации - юридического лица
          type: string
          format: uuid
          example: 5860881e-7df3-4cba-86e7-7f2d857e108f
        organizationName:
          description: Полное наименование организации
          type: string
          pattern: ^[\w\W]{1,1000}$
          minLength: 1
          maxLength: 1000
          example: Акционерное общество «Страховая/Медицинская организация»
        organizationInn:
          description: ИННЮЛ
          type: string
          minItems: 1
          maxItems: 10
          pattern: ^[\w\W]{10}$
          example: '7728241111'
        organizationKpp:
          description: КПП
          type: string
          minItems: 1
          maxItems: 9
          pattern: ^[\w\W]{9}$
          example: '770201001'
    AddressBranch:
      type: object
      description: Сведения об адресе подразделения (на территории РФ)
      properties:
        postalCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
          example: '125047'
          description: Почтовый индекс
        regionCode:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^\d{2}$
          example: '77'
          description: Код субъекта Российской Федерации
        regionName:
          type: string
          minLength: 1
          maxLength: 255
          example: Г. Москва
          description: Наименование субъекта Российской Федерации
        district:
          type: string
          example: Тверской
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          description: Район
        city:
          type: string
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          example: Москва
          description: Город
        locality:
          type: string
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          example: город Москва
          description: Населенный пункт
        street:
          type: string
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          example: 1-я Тверска́я-Ямска́я
          description: Улица
        house:
          type: string
          pattern: ^[\w\W]{1,20}$
          minLength: 1
          maxLength: 20
          example: '10'
          description: Дом
        building:
          type: string
          pattern: ^[\w\W]{1,20}$
          minLength: 1
          maxLength: 20
          example: '1'
          description: Корпус
        apartment:
          type: string
          pattern: ^[\w\W]{1,20}$
          minLength: 1
          maxLength: 20
          example: '1'
          description: Квартира
        otherDetails:
          type: string
          pattern: ^[\w\W]{1,1000}$
          minLength: 1
          maxLength: 1000
          example: Помещение №1
          description: Иные сведения об адресе в Российской Федерации
      required:
        - regionCode
        - regionName
    Customer:
      type: object
      description: Сведения об участнике факта хозяйственной жизни заказчика
      additionalProperties: false
      required:
        - LegalEntity
      properties:
        LegalEntity:
          $ref: '#/components/schemas/LegalEntity'
        Address:
          description: Сведения об адресе заказчика
          allOf:
            - $ref: '#/components/schemas/AddressBranch'
    Branch:
      type: object
      description: Сведения об участнике факта хозяйственной жизни филиала/подразделения
      additionalProperties: false
      required:
        - LegalEntity
      properties:
        LegalEntity:
          $ref: '#/components/schemas/LegalEntity'
        Address:
          description: Сведения об адресе подразделения
          allOf:
            - $ref: '#/components/schemas/AddressBranch'
    ActiveOrHistoricCurrencyCode:
      description: Код валюты, соответствующий международному стандарту ISO 4217
      type: string
      pattern: ^[A-Z]{3,3}$
      example: RUB
    ConventionalUnits:
      description: Условные единицы
      type: string
      example: У.Е.
      enum:
        - У.Е.
      x-enum-descriptions:
        - Условные единицы
      x-enum-varnames:
        - ConventionalUnits
    CurrencyInfo:
      type: object
      properties:
        Сurrency:
          description: Валюта расчета в виде кода или условные единицы
          oneOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
            - $ref: '#/components/schemas/ConventionalUnits'
        сurrencyName:
          type: string
          description: Наименование валюты
          pattern: ^.{1,100}$
          minLength: 1
          maxLength: 100
          example: Рубль
    Franchise:
      type: object
      description: Франшиза по программе, может быть выражена в процентах или в денежной сумме
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Тип франшизы
          enum:
            - percent
            - amount
          example: amount
        value:
          type: string
          description: Значение франшизы (процент или сумма в валюте взаиморасчета)
          pattern: ^\d{1,15}(\.\d{1,4})?$
          example: '10.00'
    InsuredPersonProgramm:
      type: object
      description: Информация о программе страхования и связанных с ней рисках
      additionalProperties: false
      properties:
        programName:
          type: string
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          description: Наименование программы добровольного медицинского страхования
          example: Стандарт
        programCode:
          type: string
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          description: Код программы добровольного медицинского страхования
          example: StandartAdult
        paymentType:
          type: string
          description: Тип оплаты
          example: '0'
          enum:
            - '0'
            - '1'
          x-enum-descriptions:
            - Факт
            - Аванс
          x-enum-varnames:
            - Fact
            - Advance
        agreedTreatmentLimit:
          description: Лимит ответственности по согласованному объему лечения
          example: '5000.00'
          type: string
          pattern: ^\d{1,15}\.\d{2,4}$
        СurrencyInfo:
          description: Валюта взаиморасчета
          allOf:
            - $ref: '#/components/schemas/CurrencyInfo'
        Franchise:
          description: Франшиза по программе (либо процент, либо фиксированная сумма)
          allOf:
            - $ref: '#/components/schemas/Franchise'
        InsuranceRisks:
          type: array
          description: Риски программы добровольного медицинского страхования.
          items:
            type: object
            description: Информация о программе страхования и связанных с ней рисках
            additionalProperties: false
            required:
              - riskCode
            properties:
              riskCode:
                description: Дополнительная информация, связанная с риском.
                type: string
                pattern: ^[\w\W]{1,35}$
                minLength: 1
                maxLength: 35
              riscShortName:
                description: Дополнительная информация, связанная с риском.
                type: string
                pattern: ^[\w\W]{1,70}$
                minLength: 1
                maxLength: 70
                example:
                  - Амбулаторно-поликлиническая помощь
              riscDescriptions:
                description: Дополнительная информация, связанная с риском.
                type: string
                pattern: ^[\w\W]{1,255}$
                minLength: 1
                maxLength: 255
      required:
        - programName
        - InsuranceRisks
    AddressRFType:
      type: object
