          description: Код субъекта Российской Федерации
        regionName:
          type: string
          minLength: 1
          maxLength: 255
          example: Г. Москва
          description: Наименование субъекта Российской Федерации
        district:
          type: string
          example: Тверской
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          description: Район
        city:
          type: string
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          example: Москва
          description: Город
        locality:
          type: string
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          example: город Москва
          description: Населенный пункт
        street:
          type: string
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          example: 1-я Тверска́я-Ямска́я
          description: Улица
        house:
          type: string
          pattern: ^[\w\W]{1,20}$
          minLength: 1
          maxLength: 20
          example: '10'
          description: Дом
        building:
          type: string
          pattern: ^[\w\W]{1,20}$
          minLength: 1
          maxLength: 20
          example: '1'
