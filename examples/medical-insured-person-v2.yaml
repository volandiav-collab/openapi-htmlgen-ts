    OBRUErrorResponseErrorCode:
      description: Низкоуровневое описание ошибки. Поставщик услуг должен заполнить сообщение детальным описанием ошибки, не раскрывая конфиденциальную информацию.
      type: string
      example: RU.CBR.Field.Missing
      enum:
        - RU.CBR.Field.Expected
        - RU.CBR.Field.Invalid
        - RU.CBR.Field.InvalidDate
        - RU.CBR.Field.Missing
        - RU.CBR.Header.Invalid
        - RU.CBR.Header.Missing
        - RU.CBR.Resource.InvalidFormat
        - RU.CBR.Resource.NotFound
        - RU.CBR.Resource.NotCreated
        - RU.CBR.Rules.AfterCutOffDateTime
        - RU.CBR.Signature.Invalid
        - RU.CBR.Signature.InvalidClaim
        - RU.CBR.Signature.MissingClaim
        - RU.CBR.Signature.Malformed
        - RU.CBR.Signature.Missing
        - RU.CBR.Unsupported.AccountIdentifier
        - RU.CBR.Unsupported.LocalInstrument
        - RU.CBR.Operation.Unprocessable
        - RU.CBR.Authenticate.InvalidScope
        - RU.CBR.Authenticate.InvalidConsent
        - RU.CBR.Authenticate.SuspiciousActivityDetected
        - RU.CBR.Rules.ResourceAlreadyExists
        - RU.CBR.UnexpectedError
      x-enum-descriptions:
        - 'RU.CBR.Field.Expected: (HTTP статус 400). Если поля передаются парой (ключ-значение) и значение не было передано. В поле path должен передаваться путь к ожидаемому полю (например, ErrorResponse.Errors.path == “AccountResponse.Data.Account.AccountDetails.identification”).Например, для допустимого значения поля «schemeName» должно передаваться соответствующее значение идентификатора в поле «identification».'
        - 'RU.CBR.Field.Invalid: (HTTP статус 400).В поле указано недопустимое значение или длина предоставленного значения превышает соответствующую максимальную длину поля в домене ППИУ. Ссылка на недопустимое поле должна быть указана в поле path (например,ErrorResponse.Errors.path == “AccountResponse.Data.Account.AccountDetails.schemeName”). В поле URL может быть ссылка на веб-страницу, объясняющую правильное поведение. Проблема должна быть подробно описана в сообщении об ошибке (поле ErrorResponse.Errors.message).'
        - 'RU.CBR.Field.InvalidDate: (HTTP статус 400).Указана неверная дата. Например, когда ожидается будущая дата, а указана дата в прошлом или текущая дата. В сообщении можно указать актуальную проблему с датой. Ссылка на недопустимое поле должна быть указана в поле path, а в поле URL может быть ссылка на веб-страницу, объясняющую правильное поведение.'
        - 'RU.CBR.Field.Missing: (HTTP статус 400).Обязательное поле, необходимое для API, отсутствует в полезной нагрузке. Данный код ошибки можно использовать, если ошибка еще не определена при проверке RU.CBR.Resource.InvalidFormat. Ссылка на отсутствующее поле должна быть указана в поле path, а в поле URL может быть ссылка на веб-страницу, объясняющую правильное поведение.'
        - 'RU.CBR.Header.Invalid: (HTTP статус 400).В элементе заголовка HTTP указано неверное значение. Элемент заголовка HTTP должен быть указан в элементе пути.'
        - 'RU.CBR.Header.Missing: (HTTP статус 400).Обязательный элемент HTTP-заголовка не был предоставлен. Элемент заголовка HTTP должен быть указан в элементе path. Элемент пути кода ошибки должен быть заполнен элементом ресурса согласия, который является недопустимым.'
        - 'RU.CBR.Resource.InvalidFormat: (HTTP статус 400).Json-схема полезной нагрузки не соответствует конечной точке. Например, конечная точка POST /account-consents вызывается с полезной нагрузкой JSON, которая не может быть проанализирована в классе ConsentRequest.'
        - 'RU.CBR.Resource.NotFound: (HTTP статус 400).Ресурс с указанным идентификатором не существует или не может быть обработан (в том числе неприемлимый формат или значение идентификатора ресурса).'
        - 'RU.CBR.Resource.NotCreated: (HTTP статус 400).Ресурс с указанным идентификатором еще не создан и не может быть передан в ответном сообщении. Для асинхронных вызовов. Например, получение выписки по счету, где сначала создается ресурс выписки (метод POST /statements/{accountId}) и в ответном сообщение приходит идентификатор созданного ресурса выписки, но для наполнения выписки данными ППИУ требуется некоторое время. Соответственно, будет приходить данное сообщение об ошибке.'
        - 'RU.CBR.Rules.AfterCutOffDateTime: (HTTP статус 400).Ресурс согласия или ресурс платежа запрашиваются после даты CutOffDateTime.'
        - 'RU.CBR.Signature.Invalid: (HTTP статус 400).Заголовок подписи x-jws-signature был проанализирован и имеет действительный заголовок JOSE, соответствующий спецификации. Но сама подпись не может быть проверена.'
        - 'RU.CBR.Signature.InvalidClaim: (HTTP статус 400).Заголовок JOSE в элементе x-jws-signature имеет одно или несколько утверждений (claim) с недопустимым значением. (например, утверждение kid, которое не принимает сертификат). Наименование отсутствующего утверждения должно передаваться в поле path ответа об ошибке.'
        - 'RU.CBR.Signature.MissingClaim: (HTTP статус 400).Заголовок JOSE в элементе x-jws-signature имеет одно или несколько обязательных утверждений, которые не указаны. Имя пропущенного утверждения должно быть указано в поле path ответа об ошибке.'
        - 'RU.CBR.Signature.Malformed: (HTTP статус 400).x-jws-signature в заголовке запроса была искажена и не могла быть проанализирована как допустимый JWS.'
        - 'RU.CBR.Signature.Missing: (HTTP статус 400).Запрос API предполагает x-jws-signature в заголовке, но элемент отсутствовал.'
        - 'RU.CBR.Unsupported.AccountIdentifier: (HTTP статус 400).Идентификатор счета не поддерживается для данной схемы. Элемент path должен быть заполнен путем к элементу accountIdentifier.'
        - 'RU.CBR.Unsupported.LocalInstrument: (HTTP статус 400).Указанный localInstrument не поддерживается ППИУ. Элемент path должен быть заполнен путем к элементу localInstrument. Элемент URL должен быть заполнен ссылкой на документацию ППИУ со списком поддерживаемых localInstrument.'
        - 'RU.CBR.Operation.Unprocessable: (HTTP статус 400).Операция по извлечению ресурса не может быть выполнена или недопустима.'
        - 'RU.CBR.Authenticate.InvalidScope: (HTTP статус 403).Предъявленный токен доступа не содержит область действия ("scope") необходимый для доступа к ресурсу.'
        - 'RU.CBR.Authenticate.InvalidConsent: (HTTP статус 403).Отказано доступу к ресурсу с указанным идентификатором, так как согласие Пользователя, отсутствует, либо имеет не корректный статус, либо не содержит необходимых разрешений ("pernissions") на данный ресурс.'
        - 'RU.CBR.Authenticate.SuspiciousActivityDetected: (HTTP статус 403).Доступ к ресурсу приостановлен по причине выявления подозрения на мошеннические действия.'
        - 'RU.CBR.Rules.ResourceAlreadyExists: (HTTP статус 409).Ресурс с такими же параметрами уже существует.'
        - 'RU.CBR.UnexpectedError: (HTTP статус 5xx).Данный код ошибки можно использовать при возникновении непредвиденной ошибки. ППИУ должен заполнить сообщение детальным описанием ошибки, не раскрывая конфиденциальную информацию.'
      x-enum-varnames:
        - FieldExpected
        - FieldInvalid
        - FieldInvalidDate
        - FieldMissing
        - HeaderInvalid
        - HeaderMissing
        - ResourceInvalidFormat
        - ResourceNotFound
        - ResourceNotCreated
        - RulesAfterCutOffDateTime
        - SignatureInvalid
        - SignatureInvalidClaim
        - SignatureMissingClaim
        - SignatureMalformed
        - SignatureMissing
        - UnsupportedAccountIdentifier
        - UnsupportedLocalInstrument
        - OperationUnprocessable
        - AuthenticateInvalidScope
        - AuthenticateInvalidConsent
        - AuthenticateSuspiciousActivityDetected
        - RulesResourceAlreadyExists
        - UnexpectedError
    OBRUError:
      description: Контейнер с ошибкой
      type: object
      additionalProperties: false
      properties:
        errorCode:
          $ref: '#/components/schemas/OBRUErrorResponseErrorCode'
        message:
          type: string
          pattern: ^[\w\W]{1,500}$
          minLength: 1
          maxLength: 500
          description: Описание ошибки
          example: Обязательное поле не указано
        path:
          type: string
          pattern: ^[\w\W]{1,500}$
          minLength: 1
          maxLength: 500
          description: Путь к элементу с ошибкой в JSON объекте. Рекомендуемое, но не обязательное поле
          example: Data.Model.Object.name
        url:
          type: string
          format: uri
          description: URL для помощи в устранении проблемы, Также через URL можно предоставлять дополнительную информацию
          example: https://example.com/error-description
      required:
        - errorCode
        - message
    OBRUErrorResponse:
      description: Контейнер с детализацией ошибки
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,40}$
          minLength: 1
          maxLength: 40
          description: Высокоуровневый текстовый код ошибки, необходимый для классификации
          example: '400'
        id:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,40}$
          minLength: 1
          maxLength: 40
          description: Уникальный идентификатор ошибки, для целей аудита, в случае неизвестных / не классифицированных ошибок
          example: 4aca5b0d-1730-416f-a52b-6d353b687082
        message:
          type: string
          pattern: ^[\w\W]{1,500}$
          minLength: 1
          maxLength: 500
          description: Краткое сообщение об ошибке. Например, «что-то не так с предоставленными параметрами запроса»
          example: Bad Request
        Errors:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/OBRUError'
          minItems: 1
      required:
        - code
        - message
        - Errors
    InsuredPersonListProcessingIssue:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
          description: Код ошибки
          pattern: ^[A-Z0-9_]{1,50}$
          example: CONTRACT_NOT_FOUND
        message:
          type: string
          description: Описание ошибки
          pattern: ^[\w\W]{1,500}$
          example: Договор DMS-12234-10\2023-F не найден
        documentNumber:
          description: Номер документа, если ошибка связана с ним. При отсутствии номера принимает значение (без номера (б/н). Регистрационный номер в системе делопроизводства
          type: string
          pattern: ^[\w\W]{1,255}$
          minLength: 1
          maxLength: 255
          example: DMS-12234-10\2023-F
    InsuredPersonProcessingIssue:
      type: object
      required:
        - seriesAndNumberDms
        - errorCode
        - message
      properties:
        seriesAndNumberDms:
          type: string
          description: Серия и номер ДМС-полиса застрахованного лица
          example: DMS-0001-01-2025
        errorCode:
          type: string
          description: Код ошибки обработки записи
          example: INVALID_SNILS
        message:
          type: string
          description: Описание ошибки
          example: Некорректный формат СНИЛС
    InsuredPersonListProcessingStatus:
      type: object
      required:
        - insuredPersonId
        - status
        - processedAt
        - InsuredPersonSummary
      properties:
        insuredPersonId:
          type: string
          format: uuid
          description: Идентификатор списка застрахованных лиц
        status:
          type: string
          enum:
            - processed
            - pending
            - rejected
          description: Текущий статус обработки
        processedAt:
          type: string
          format: date-time
        TopLevelIssues:
          type: array
          description: Ошибки верхнего уровня (по договору или блоку данных),  при наличии
          items:
            $ref: '#/components/schemas/InsuredPersonListProcessingIssue'
        InsuredPersonSummary:
          type: object
          description: Сводные результаты по результатом обработки данных записей застрахованного лица
          required:
            - totalRecords
            - acceptedRecords
            - rejectedRecords
          properties:
            totalRecords:
              type: integer
              example: 100
            acceptedRecords:
              type: integer
              example: 98
            rejectedRecords:
              type: integer
              example: 2
        InsuredPersonIssue:
          type: array
          description: Ошибки по каждому застрахованному лицу, при наличии
          items:
            $ref: '#/components/schemas/InsuredPersonProcessingIssue'
  responses:
    200InsuredPerson:
      description: Запрос успешно выполнен
      headers:
        x-fapi-interaction-id:
          required: true
          description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
          schema:
            type: string
            format: uuid
            description: Универсальный уникальный идентификатор (UUID) версии 4, в соответствии с IETC RFC 4122 "Universally Unique IDentifier (UUID) URN Namespace".
          example: 97ed4827-7b6f-4491-a06f-b548d5a7512d
        x-jws-signature:
          required: false
          description: Отделяемая подпись полезной нагрузки в формате JWS
          schema:
            type: string
        x-knd-code:
          description: Код документа по КНД (классификатору налоговой декларации)
          schema:
            type: string
            pattern: ^[\w\W]{1,7}$
            minLength: 1
            maxLength: 7
            example: '1110387'
        x-date-time:
          description: Дата и время формирования файла обмена информации исполнителя
          schema:
            type: string
            format: date-time
            example: '2021-06-05T15:15:13+00:00'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InsuredPersonResponse'
    400Error:
      description: Запрос имеет неверное, отсутствующее или несовместимое тело JSON, параметры URL или поля заголовка
      headers:
        x-fapi-interaction-id:
          schema:
            type: string
            format: uuid
          description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OBRUErrorResponse'
          examples:
            obru:
              value:
                code: '400'
                id: 5aca5b0d-1730-416f-a52b-6d353b687082
                message: Bad Request
                Errors:
                  - errorCode: RU.CBR.Field.Missing
                    message: Обязательное поле, необходимое для API, отсутствует в полезной нагрузке
                    path: Data.Model.Object.filled
                    url: https://example.com/error-description
    401Error:
      description: Заголовок авторизации отсутствует или неверный токен
      headers:
        x-fapi-interaction-id:
          required: true
          schema:
            type: string
            format: uuid
        www-authenticate:
          required: true
          schema:
            type: string
            enum:
              - Valid token required
    403Error:
      description: Токен имеет неверную область действия или была нарушена политика безопасности
      headers:
        x-fapi-interaction-id:
          schema:
            type: string
            format: uuid
          description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OBRUErrorResponse'
          example:
            code: '403'
            id: ab41a751-619b-4947-bf0a-251f6e92f599
            message: Forbidden
            Errors:
              - errorCode: RU.CBR.Authenticate.InvalidScope
                message: Предъявленный токен доступа не содержит область действия (scope) необходимый для доступа к ресурсу
                url: https://example.com/error-description
    404Error:
      description: Сторонний Поставщик пытается получить ресурс, который указан в спецификации, но не реализован на стороне ППИУ, либо ресурс, который не определен
      headers:
        x-fapi-interaction-id:
          schema:
            type: string
            format: uuid
          description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
    406Error:
      description: Запрос содержал параметр заголовка Accept, отличный от разрешенных media types, и набор символов, отличный от UTF-8
      headers:
        x-fapi-interaction-id:
          schema:
            type: string
            format: uuid
          description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
    429Error:
      description: Операция была отклонена, так как слишком много запросов было сделано в течение определенного периода времени
      headers:
        x-fapi-interaction-id:
          schema:
            type: string
            format: uuid
          description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
        Retry-After:
          schema:
            type: string
    500Error:
      description: Что-то пошло не так на стороне Стороннего поставщика.
      headers:
        x-fapi-interaction-id:
          schema:
            type: string
            format: uuid
          description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OBRUErrorResponse'
          example:
            code: '500'
            id: af467d1b-985d-4a8e-972e-24a32287085f
            message: Internal Server Error
            Errors:
              - errorCode: RU.CBR.UnexpectedError
                message: Что-то пошло не так на стороне Поставщика услуг
                path: Data.Model.Object.filled
                url: https://example.com/error-description
    200Head:
      description: Запрос успешно выполнен
      headers:
        x-fapi-interaction-id:
          schema:
            type: string
      content:
        application/json:
          schema:
            title: No response
            type: object
            properties: {}
    304NotModified:
      description: Ресурс не изменен. Указывает, что нет необходимости повторно передавать запрошенные ресурсы. Это происходит, когда запрос является условным и использует If-None-Match или If-Modified-Since.
      headers:
        x-fapi-interaction-id:
          schema:
            type: string
            format: uuid
          description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
    405Error:
      description: Сторонний Поставщик пытается получить доступ к ресурсу с помощью метода, который не поддерживается
      headers:
        x-fapi-interaction-id:
          schema:
            type: string
            format: uuid
          description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
