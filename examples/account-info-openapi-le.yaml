openapi: 3.1.0
info:
  title: Получение информации о банковских счетах клиента. Методы для Юридических Лиц.
  description: "\n<h2> Введение </h2>\n\nСтандарт содержит описание конечных точек, модели данных и контроля доступа к данным, которые являются общими для всех API, определяющих взаимодействие между Сторонним поставщиком и Поставщиком услуг в процессе получения информации по банковским счетам Физических Лиц.\n\n<h2> Область применения </h2>\n\nСтандарт рекомендован к использованию организациями при обмене финансовыми сообщениями, связанными с получением информации о банковском счете.\nСтандарт предназначен для:\n- участников получения информации о банковском счете (кредитные организации и их клиенты, а также Сторонние поставщики);\n- разработчиков информационного и программного обеспечения, информационных систем.\n\nПоложения настоящего стандарта применяются на добровольной основе, если только в отношении конкретных положений обязательность их применения не установлена нормативными актами Банка России или условиями договоров.\nПоложения настоящего стандарта применяются совместно со следующими документами:\n- СТО БР ФАПИ.СЕК-1.6-2024 Стандарт Банка России \"Безопасность финансовых (банковских) операций. Прикладные программные интерфейсы обеспечения безопасности финансовых сервисов на основе протокола OpenID\" (далее ФАПИ.СЕК).\n- СТО БР ФАПИ.ПАОК-1.0-2024 Стандарт Банка России \"Безопасность финансовых (банковских) операций. Обеспечения безопасности финансовых сервисов при инициации OpenID Connect клиентом потока аутентификации по отдельному каналу\" (далее ФАПИ.ПАОК).\n- СТО БР Открытые программные интерфейсы. Общие положения.\n- СТО БР Открытые программные интерфейсы. Общие требования к прикладным стандартам.\n- СТО БР Открытые программные интерфейсы. Получение информации о банковских счетах клиента. Спецификация API. Описание взаимодействия.\n- СТО БР Открытые программные интерфейсы. Получение информации о банковских счетах клиента. Правила взаимодействия.\n- СТО БР Открытые программные интерфейсы. Получение согласия на доступ к банковским счетам клиента. Методы для Юридических Лиц.\n- СТО БР Открытые программные интерфейсы. Профиль для расширенного режима безопасности.\n\n<h2> Термины и определения </h2>\n\nВ Стандарте применяются термины и определения в соответствии со стандартами ФАПИ.СЕК, ФАПИ.ПАОК, «Открытые программные интерфейсы. Общие положения» а также следующие:\n- `Ресурс`-\tРесурсом является представление любой сущности (например, перевод денежных средств, счет, транзакция) в определенном формате (например JSON). Каждый ресурс идентифицируется посредством постоянного идентификатора, который не меняется при изменении состояния ресурса.\n- `Полезная нагрузка`\tЧасть пакета данных (сообщения) без служебной информации (без заголовка, битов синхронизации и т. п.).\n- `YAML` -\tФормат сериализации данных, концептуально близкий к языкам разметки, но ориентированный на удобство ввода‑вывода типичных структур данных многих языков программирования.\n- `ППИУ` - Поставщик платежных и информационных и услуг.\n- `СПИУ` - Сторонний поставщик информационных услуг.\n- `Информационный сервис` - Сервис предоставления информации о счетах Пользователя в режиме реального времени.\n\n<h2> Общее описание процесса </h2>\n\nСпецификация API определяет поток взаимодействия при получении информации о счете клиента третей стороной через информационный сервис Открытых банковских интерфейсов Среды Открытых банковских интерфейсов, которые позволяют СПИУ:\n- Создать или отозвать ресурс согласие на доступ к счету;\n- Получать данные, связанные со счетом клиента.\n"
  version: 2.0.0
  termsOfService: https://openbankingrussia.ru/terms/01
  contact:
    name: Ассоциация развития финансовых технологий (Ассоциация ФинТех)
    url: https://fintechru.org
    email: info@openbankingrussia.ru
  license:
    name: open-licence
    url: https://openbankingrussia.ru
  x-logo:
    url: static/logo.svg
    altText: Открытые банковские интерфейсы
    href: https://openbankingrussia.ru/
servers:
  - url: https://sb0.openbankingrussia.ru/sandbox0/open-banking/v2.0/aisp-le
    description: |
      Сервер ресурсов в рамках данной спецификации должен предоставлять единственный URI, соответствующий следующей структуре:
      ```http
      - participant-path-prefix]/open-banking/[version]/[resource-group]/[resource]/[resource-id]/[sub-resource]
      ````
      При этом параметр `resource-group` для данной спецификации должен иметь значение `aisp-le`.
tags:
  - name: Accounts
    description: Информация о счете
  - name: Balances
    description: Остаток на счете
  - name: Statements Sync
    description: Выписки по счету в синхронном режиме
  - name: Statements Async
    description: Выписки по счету в асинхронном режиме
paths:
  /accounts:
    get:
      operationId: getAccounts
      externalDocs:
        description: Примеры использования AccountsLE.md
        url: static/openapi-docs/Accounts.md
      tags:
        - Accounts
      summary: Получение списка счетов
      description: |
        Конечная точка позволяет СПИУ получать полный список счетов и их
        идентификаторы (accountId), которые были авторизованы Пользователем на
        стороне ППИУ
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          $ref: '#/components/responses/200GetAccountsLE'
        '400':
          $ref: '#/components/responses/400Error-req'
        '401':
          $ref: '#/components/responses/401Error-req'
        '403':
          $ref: '#/components/responses/403Error-req'
        '405':
          $ref: '#/components/responses/405Error-req'
        '406':
          $ref: '#/components/responses/406Error-req'
        '429':
          $ref: '#/components/responses/429Error-req'
        '500':
          $ref: '#/components/responses/500Error-req'
        '501':
          $ref: '#/components/responses/501Error-req'
        '503':
          $ref: '#/components/responses/503Error-req'
      security:
        - PSUAccountConsentsLE:
            - obru-accounts-le
  /accounts/{accountId}:
    get:
      operationId: getAccountsAccountId
      tags:
        - Accounts
      summary: Получение детальной информации о счете по его идентификатору `accountId`
      description: Конечная точка позволяет СПИУ получать детальную информацию о счете по идентификатору accountId (который был получен при вызове конечной точке списка счетов GET /accounts)
      parameters:
        - $ref: '#/components/parameters/accountId'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          $ref: '#/components/responses/200GetAccountsLEAccountId'
        '400':
          $ref: '#/components/responses/400Error-req'
        '401':
          $ref: '#/components/responses/401Error-req'
        '403':
          $ref: '#/components/responses/403Error-req'
        '405':
          $ref: '#/components/responses/405Error-req'
        '406':
          $ref: '#/components/responses/406Error-req'
        '429':
          $ref: '#/components/responses/429Error-req'
        '500':
          $ref: '#/components/responses/500Error-req'
        '501':
          $ref: '#/components/responses/501Error-req'
        '503':
          $ref: '#/components/responses/503Error-req'
      security:
        - PSUAccountConsentsLE:
            - obru_accounts_le
  /accounts/{accountId}/balances:
    get:
      operationId: getAccountsAccountIdBalances
      tags:
        - Balances
      summary: Баланс банковского счета по идентификатору accountId
      description: |
        Конечная точка позволяет СПИУ получать информацию об остатке на счете с
        идентификатором accountId
      parameters:
        - $ref: '#/components/parameters/accountId'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          $ref: '#/components/responses/200GetAccountsAccountIdBalancesLE'
        '400':
          $ref: '#/components/responses/400Error-req'
        '401':
          $ref: '#/components/responses/401Error-req'
        '403':
          $ref: '#/components/responses/403Error-req'
        '405':
          $ref: '#/components/responses/405Error-req'
        '406':
          $ref: '#/components/responses/406Error-req'
        '429':
          $ref: '#/components/responses/429Error-req'
        '500':
          $ref: '#/components/responses/500Error-req'
        '501':
          $ref: '#/components/responses/501Error-req'
        '503':
          $ref: '#/components/responses/503Error-req'
      security:
        - PSUAccountConsentsLE:
            - obru_accounts_le
  /balances:
    get:
      operationId: getBalances
      externalDocs:
        description: Примеры использования BalancesLE.md
        url: static/openapi-docs/BalancesLE.md
      tags:
        - Balances
      summary: Остаток денежных средств по всем счетам
      description: |
        Конечная точка позволяет СПИУ получать остаток по всем счетам, которые были
        авторизованы Пользователем для доступа с помощью согласия
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          $ref: '#/components/responses/200GetBalancesLE'
        '400':
          $ref: '#/components/responses/400Error-req'
        '401':
          $ref: '#/components/responses/401Error-req'
        '403':
          $ref: '#/components/responses/403Error-req'
        '405':
          $ref: '#/components/responses/405Error-req'
        '406':
          $ref: '#/components/responses/406Error-req'
        '429':
          $ref: '#/components/responses/429Error-req'
        '500':
          $ref: '#/components/responses/500Error-req'
        '501':
          $ref: '#/components/responses/501Error-req'
        '503':
          $ref: '#/components/responses/503Error-req'
      security:
        - PSUAccountConsentsLE:
            - obru_accounts_le
  /statements:
    post:
      operationId: createStatementsAccountId
      tags:
        - Statements Async
      summary: Создание ресурса выписки
      description: Конечная точка позволяет СПИУ создать ресурс выписки по идентификатору счета accountId, который предоставляется при вызове конечной точки GET /accounts
      parameters:
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-idempotency-key'
        - $ref: '#/components/parameters/x-jws-signature'
        - $ref: '#/components/parameters/x-customer-user-agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementInitRequest'
            example:
              Data:
                Statement:
                  accountId: 95791e79-0f2d-47de-a5e0-df034b285XXx
                  fromBookingDateTime: '2019-09-03T00:00:00+00:00'
                  toBookingDateTime: '2019-12-03T00:00:00+00:00'
      responses:
        '201':
          $ref: '#/components/responses/201PostStatementInitResponse'
        '400':
          $ref: '#/components/responses/400Error-req'
        '401':
          $ref: '#/components/responses/401Error-req'
        '403':
          $ref: '#/components/responses/403Error-req'
        '405':
          $ref: '#/components/responses/405Error-req'
        '406':
          $ref: '#/components/responses/406Error-req'
        '429':
          $ref: '#/components/responses/429Error-req'
        '500':
          $ref: '#/components/responses/500Error-req'
        '501':
          $ref: '#/components/responses/501Error-req'
        '503':
          $ref: '#/components/responses/503Error-req'
      security:
        - PSUAccountConsentsLE:
            - obru_accounts_le
  /statements/{statementId}:
    get:
      operationId: getStatementsStatementId
      tags:
        - Statements Async
      summary: Получение выписки по идентификатору выписки
      description: Конечная точка позволяет СПИУ получать выписки по идентификатору выписки
      parameters:
        - $ref: '#/components/parameters/statementId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/fromBookingDateTime'
        - $ref: '#/components/parameters/toBookingDateTime'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          $ref: '#/components/responses/200GetStatementsStatementId'
        '400':
          $ref: '#/components/responses/400Error-req'
        '401':
          $ref: '#/components/responses/401Error-req'
        '403':
          $ref: '#/components/responses/403Error-req'
        '405':
          $ref: '#/components/responses/405Error-req'
        '406':
          $ref: '#/components/responses/406Error-req'
        '429':
          $ref: '#/components/responses/429Error-req'
        '500':
          $ref: '#/components/responses/500Error-req'
        '501':
          $ref: '#/components/responses/501Error-req'
        '503':
          $ref: '#/components/responses/503Error-req'
      security:
        - PSUAccountConsentsLE:
            - obru_accounts_le
  /accounts/{accountId}/statements:
    get:
      operationId: getAccountsAccountIdStatements
      externalDocs:
        description: Примеры использования Statements.md
        url: static/openapi-docs/Statements.md
      tags:
        - Statements Sync
      summary: Получение выписки по идентификатору счета
      description: Конечная точка позволяет СПИУ получать выписки по идентификатору счета в режиме онлайн
      parameters:
        - $ref: '#/components/parameters/accountId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/fromBookingDateTime'
        - $ref: '#/components/parameters/toBookingDateTime'
        - $ref: '#/components/parameters/x-fapi-auth-date'
        - $ref: '#/components/parameters/x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          $ref: '#/components/responses/200GetAccountsAccountIdStatements'
        '400':
          $ref: '#/components/responses/400Error-req'
        '401':
          $ref: '#/components/responses/401Error-req'
        '403':
          $ref: '#/components/responses/403Error-req'
        '405':
          $ref: '#/components/responses/405Error-req'
        '406':
          $ref: '#/components/responses/406Error-req'
        '429':
          $ref: '#/components/responses/429Error-req'
        '500':
          $ref: '#/components/responses/500Error-req'
        '501':
          $ref: '#/components/responses/501Error-req'
        '503':
          $ref: '#/components/responses/503Error-req'
      security:
        - PSUAccountConsentsLE:
            - obru_accounts_le
components:
  securitySchemes:
    TPPAccountConsentsLE:
      type: oauth2
      description: СПИУ использует поток авторизации сlient сredentional для доступа к ресурсам ППИУ
      flows:
        clientCredentials:
          tokenUrl: https://sb0.openbankingrussia.ru/sandbox0/as/aft/connect/token
          scopes:
            obru_account_consents_le: Доступ к ресурсу согласия
    PSUAccountConsentsLE:
      type: oauth2
      description: Поток авторизации, требующий получения СПИУ авторизации конечного Пользователя на доступ к ресурсам на сервере авторизации ППИУ.
      flows:
        authorizationCode:
          authorizationUrl: https://sb0.openbankingrussia.ru/sandbox0/as/aft/connect/authorize
          tokenUrl: https://sb0.openbankingrussia.ru/sandbox0/as/aft/connect/token
          scopes:
            obru_accounts_le: доступ к информации о счете
  parameters:
    page:
      name: page
      in: query
      required: false
      description: Номер страницы
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 5000
        default: 1
    x-fapi-auth-date:
      in: header
      name: x-fapi-auth-date
      schema:
        type: string
        minLength: 1
        maxLength: 29
        pattern: ^[a-zA-Z0-9 :,]{29}$
      required: false
      description: 'Время последнего входа Пользователя в систему с TPP. Значение предоставляется в виде HTTP-date, как в разделе 7.1.1.1 [RFC7231]. Например, x-fapi-auth-date: Mon, 26 Aug 2019 12:23:11 GMT'
      example: Mon, 26 Aug 2019 12:23:11 GMT
    x-fapi-customer-ip-address:
      in: header
      name: x-fapi-customer-ip-address
      schema:
        type: string
        minLength: 0
        maxLength: 21
        pattern: ^([0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|(\d{1,3}\.){3}\d{1,3}$
        example: 172.123.123.123
      required: false
      description: IP-адрес Пользователя, если Пользователь в данный момент подключен к Стороннему Поставщику (авторизован в приложении Стороннего Поставщика).
    x-fapi-interaction-id:
      in: header
      name: x-fapi-interaction-id
      required: true
      description: RFC4122 UID, используемый в качестве идентификатора корреляции. Если необходимо, то Сторонний поставщик передает обратно значение идентификатора корреляции в заголовке ответа x-fapi-interaction-id.
      schema:
        type: string
        format: uuid
        description: Универсальный уникальный идентификатор (UUID) версии 4, в соответствии с IETC RFC 4122 "Universally Unique IDentifier (UUID) URN Namespace".
      example: 97ed4827-7b6f-4491-a06f-b548d5a7512d
    x-customer-user-agent:
      in: header
      name: x-customer-user-agent
      schema:
        type: string
      description: В заголовке указывается тип устройства (user-agent), который использует Пользователь. Сторонний Поставщик может заполнить это поле значением типа устройства (user-agent), указанным Пользователем. Если Пользователь использует мобильное приложение Стороннего Поставщика, Сторонний Поставщик проверяет, что строка типа устройства (user-agent) отличается от строки типа устройства (user-agent) на основе браузера.
      required: false
      example: mobile
    accountId:
      name: accountId
      in: path
      required: true
      description: Идентификатор счета
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{1,40}$
        minLength: 1
        maxLength: 40
        example: this-is-a-slug-format-account-id
    x-idempotency-key:
      name: x-idempotency-key
      in: header
      description: Уникальный идентификатор запроса для поддержки идемпотентности. Обязательно для запросов POST к конечным точкам идемпотентного ресурса. Для других запросов не указывается.
      required: false
      schema:
        type: string
        format: uuid
    x-jws-signature:
      name: x-jws-signature
      in: header
      required: true
      description: Отделяемая подпись полезной нагрузки в формате JWS
      schema:
        type: string
    statementId:
      name: statementId
      in: path
      required: true
      description: Идентификатор выписки
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{1,40}$
        maxLength: 40
        minLength: 1
      example: 9b23e27e-f4f8-4cab-9b80-aaa008d4330c
