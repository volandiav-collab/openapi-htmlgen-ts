    Product2:
      type: object
      additionalProperties: false
      description: Информация о продукте
      properties:
        productCode:
          description: Код продукта
          type: string
          pattern: ^[\w\W]{1,70}$
          maxLength: 70
          minLength: 1
          example: code-01-ac
        unitOfMeasure:
          $ref: '#/components/schemas/UnitOfMeasure1Code'
        productQuantity:
          description: Количество товара
          type: string
          pattern: ^[0-9]{1,18}$|^[0-9]{1,18}[.][0-9]{1,18}$
          example: '10.2'
        unitPrice:
          description: Цена за единицу товара
          $ref: '#/components/schemas/ActiveCurrencyAndAmountSimpleType'
        productAmount:
          description: Денежная стоимость приобретаемого товара
          $ref: '#/components/schemas/ActiveCurrencyAndAmountSimpleType'
        taxType:
          description: Код причины постановки на учет (КПП)
          type: string
          pattern: ^\d{9}$
          example: '991230001'
        additionalProductInformation:
          description: Дополнительная информация о товаре
          type: string
          pattern: ^[\w\W]{1,35}$
          maxLength: 35
          minLength: 1
          example: Дополнительная информация о товаре
      required:
        - productCode
    CardIndividualTransaction2:
      type: object
      additionalProperties: false
      description: Сведения об отдельной операции по карте, записанные на POI-терминале (точке взаимодействия)
      properties:
        transactionCategory:
          description: Код категории соответствует ISO 18245 и относится к типу услуг или товаров, которые продавец предоставляет для транзакции
          type: string
          pattern: ^[\w\W]{1,4}$
          maxLength: 4
          minLength: 1
        sequenceNumber:
          description: Порядковый номер транзакции по карте, назначенный POI (точка взаимодействия)
          type: string
          pattern: ^[\w\W]{1,35}$
          maxLength: 35
          minLength: 1
          example: '01'
        TransactionIdentification:
          description: Идентификатор операции, назначенной POI (точка взаимодействия)
          allOf:
            - $ref: '#/components/schemas/TransactionIdentifier1'
        Product:
          description: Товар, заказанный по операции
          type: array
          maxItems: 1000
          items:
            allOf:
              - $ref: '#/components/schemas/Product2'
        authorizationCode:
          description: Код авторизации операции
          type: string
          pattern: ^[\w\W]{3,35}$
          maxLength: 35
          minLength: 3
          example: '123'
    CardTransaction18:
      type: object
      additionalProperties: false
      description: Предоставляет данные по карте (номер, платежная система), терминалу (номер, идентификатор) и транзакционные данные, используемые для уникальной идентификации операции по карте
      properties:
        Card:
          $ref: '#/components/schemas/PaymentCard4'
        POI:
          description: Физический или логический карточный платежный терминал, состоящий из программного обеспечения и аппаратной части
          allOf:
            - $ref: '#/components/schemas/PointOfInteraction1'
        Transaction:
          description: Сведения об отдельной операции по карте, записанные на POI-терминале (точке взаимодействия)
          allOf:
            - $ref: '#/components/schemas/CardIndividualTransaction2'
    ReferredDocumentInformation:
      description: Информация о связанном документе. В первом повторении секции ReferredDocumentInformation указывается Дата составления распоряжения. По договоренности участников обмена могут быть указаны иные коды связанных документов в последующих повторениях секции ReferredDocumentInformation.
      type: object
      additionalProperties: false
      properties:
        type:
          description: |
            Тип связанного документа. Для указания Даты составления распоряжения (реквизит 4) в relatedDate в данном поле указывается значение "POD" (Payment Order Date).
            Допустимо использовать иные коды по договоренности участников обмена.
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: '0'
        number:
          description: Номер связанного документа
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: '0'
        relatedDate:
          description: Дата связанного документа
          type: string
          format: date
          example: '2021-06-05'
    CreditorReferenceInformation:
      type: object
      description: Информация о референсах, предоставленная получателем денежных средств, позволяющая идентифицировать исходные документы.
      additionalProperties: false
      properties:
        type:
          description: |
            Тип идентификатора платежа (Номер реквизита 15.6.n)
            Возможные значения реквизита:
            -УИП2: Уникальный идентификатор платежа, присвоенный получателем средств или идентификатор государственного контракта.
            -УИН: Уникальный идентификатор начисления.
            -ИПД: Идентификатор платежного документа.
            -ЕЛС: Единый лицевой счет.
            -ЖКУ: Идентификатор жилищно-коммунальных услуг.
            -ДОГН: Номер договора, товарного документа, иного документа, являющегося основанием платежа.
            -ДОКД: Дата договора, товарного документа, иного документа, являющегося основанием платежа.
            -Период оплаты платежа.
            -Иное, по договоренности участников обмена.
          type: string
          pattern: ^[\w\W]{1,35}$
          maxLength: 35
          example: ИПД
        reference:
          description: Значение идентификатора платежа (Номер реквизита 15.7.n). Ссылка, присвоенная получателем денежных средств, которая является основанием для осуществления перевода
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: CBR-130
    TaxParty:
      description: Налоговая информация об участнике перевода денежных средств
      type: object
      additionalProperties: false
      properties:
        taxType:
          description: Код причины постановки на учет (КПП)
          type: string
          pattern: ^\d{9}$
          example: '991230001'
        registrationIdentification:
          description: Реквизит 107. Код таможенного органа (Поле заполняется для распоряжений по уплате таможенных платежей)
          type: string
          pattern: ^[\w\W]{1,35}$
          maxLength: 35
          example: aa-12340
