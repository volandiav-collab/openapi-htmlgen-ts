er-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class=\"MsoNormal\" style=\"white-space: pre-line;\">MM12</p></td>\n\t\t<td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class=\"MsoNormal\" style=\"white-space: pre-line;\">Декабрь</p></td>\n\t</tr>\n\t<tr>\n\t\t<td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class=\"MsoNormal\" style=\"white-space: pre-line;\">QTR1</p></td>\n\t\t<td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class=\"MsoNormal\" style=\"white-space: pre-line;\">Первый квартал</p></td>\n\t</tr>\n\t<tr>\n\t\t<td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class=\"MsoNormal\" style=\"white-space: pre-line;\">QTR2</p></td>\n\t\t<td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class=\"MsoNormal\" style=\"white-space: pre-line;\">Второй квартал</p></td>\n\t</tr>\n\t<tr>\n\t\t<td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class=\"MsoNormal\" style=\"white-space: pre-line;\">QTR3</p></td>\n\t\t<td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class=\"MsoNormal\" style=\"white-space: pre-line;\">Третий квартал</p></td>\n\t</tr>\n\t<tr>\n\t\t<td valign=top style='border-top:none;border-left:none;border-bottom:solid #D