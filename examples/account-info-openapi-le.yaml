    OBRUError:
      description: Контейнер с ошибкой
      type: object
      additionalProperties: false
      properties:
        errorCode:
          description: Низкоуровневое описание ошибки
          $ref: '#/components/schemas/OBRUErrorResponseErrorCode'
        message:
          type: string
          pattern: ^[\w\W]{1,500}$
          minLength: 1
          maxLength: 500
          description: Описание ошибки
          example: Обязательное поле не указано
        path:
          type: string
          pattern: ^[\w\W]{1,500}$
          minLength: 1
          maxLength: 500
          description: Путь к элементу с ошибкой в JSON объекте. Рекомендуемое, но не обязательное поле
          example: Data.Model.Object.name
        url:
          type: string
          format: uri
          description: URL для помощи в устранении проблемы, Также через URL можно предоставлять дополнительную информацию
          example: https://example.com/error-description
      required:
        - errorCode
        - message
    OBRUErrorResponse:
      description: Контейнер с детализацией ошибки
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,40}$
          minLength: 1
          maxLength: 40
          description: Высокоуровневый текстовый код ошибки, необходимый для классификации
          example: '400'
        id:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,40}$
          minLength: 1
          maxLength: 40
          description: Уникальный идентификатор ошибки, для целей аудита, в случае неизвестных / не классифицированных ошибок
          example: 4aca5b0d-1730-416f-a52b-6d353b687082
        message:
          type: string
          pattern: ^[\w\W]{1,500}$
          minLength: 1
          maxLength: 500
          description: Краткое сообщение об ошибке. Например, «что-то не так с предоставленными параметрами запроса»
          example: Bad Request
        Errors:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/OBRUError'
          minItems: 1
      required:
        - code
        - message
        - Errors
    BalanceTypeLE:
      description: |
        Тип остатка
        <table class=ScrollTableNormal border=1 cellspacing=0 cellpadding=0
              style='width:100.0%;border-collapse:collapse;border:none'>
          <thead>
            <tr>
                <th valign=top style='border:solid #DDDDDD 1.0pt;background:#F0F0F0; width:20.0%;
                    padding:1.5pt 1.5pt 1.0pt 1.5pt'>
                    <p class=MsoNormal><span lang=RU style='color:#262626'><b>Значение</b></span></p>
                </th>
                <th valign=top style='border:solid #DDDDDD 1.0pt;border-left:none;
                    background:#F0F0F0;padding:1.5pt 1.5pt 1.0pt 1.5pt; width:80.0%'>
                    <p class=MsoNormal><span lang=RU style='color:#262626'><b>Описание</b></span></p>
                </th>
            </tr>
          </thead>
          <tbody>
            <tr>
                <td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class="MsoNormal" style="white-space: pre-line;">Expected</p></td>
                <td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class="MsoNormal" style="white-space: pre-line;">Доступный баланс в течение операционного дня, учитывающий проведенные операции, ожидаемые поступления и списания на момент запроса.</p></td>
            </tr>
            <tr>
                <td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class="MsoNormal" style="white-space: pre-line;">InterimAvailable</p></td>
                <td valign=top style='border-top:none;border-left:none;border-bottom:solid #DDDDDD 1.0pt; border-right:solid #DDDDDD 1.0pt;padding:1.5pt 1.5pt 1.0pt 1.5pt'><p class="MsoNormal" style="white-space: pre-line;">Доступный баланс в течение операционного дня, учитывающий проведенные операции, ожидаемые поступления и списания, а также доступные кредитные линии или овердрафты на момент запроса.</p></td>
            </tr>
          </tbody>
        </table>
      type: string
      enum:
        - ClosingAvailable
        - ClosingBooked
        - ClosingCleared
        - Expected
        - OpeningAvailable
        - OpeningBooked
        - OpeningCleared
        - PreviouslyClosedBooked
        - InterimAvailable
      x-enum-descriptions:
        - Конечный остаток суммы денег, которая находится в распоряжении владельца счета на указанную дату
        - Остаток по счету на конец предварительно согласованного отчетного периода. Это сумма начального зарегистрированного баланса в начале периода и всех записей, зачисленных на счет в течение предварительно согласованного отчетного периода
        - Конечный остаток суммы денег, которая очищается в указанную дату
        - Доступный баланс в течение операционного дня, учитывающий проведенные операции, ожидаемые поступления и списания на момент запроса.
        - Начальный баланс суммы денег, которая находится в распоряжении владельца счета на указанную дату
        - Баланс счета в начале отчетного периода. Он всегда равен балансу из предыдущего отчета
        - Начальный баланс, который очищается в указанную дату
        - Остаток по счету за ранее закрытый отчетный период. Начальный зарегистрированный баланс на новый период равен этому балансу
        - Доступный баланс в течение операционного дня, учитывающий проведенные операции, ожидаемые поступления и списания, а также доступные кредитные линии или овердрафты на момент запроса
      x-enum-varnames:
        - ClosingAvailable
        - ClosingBooked
        - ClosingCleared
        - Expected
        - OpeningAvailable
        - OpeningBooked
        - OpeningCleared
        - PreviouslyClosedBooked
        - InterimAvailable
