    CurrencyExchange:
      description: Подробная информация об обмене валюты
      type: object
      additionalProperties: false
      properties:
        sourceCurrency:
          description: Валюта, из которой необходимо конвертировать сумму
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
        targetCurrency:
          description: Валюта, в которую необходимо конвертировать сумму
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
        unitCurrency:
          description: Валюта, в которой обменный курс выражен
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
        exchangeRate:
          description: Коэффициент, используемый для перевода суммы из одной валюты в другую. Это отражает цену, по которой одна валюта была куплена за другую валюту
          type: string
          pattern: ^[\w\W]{1,12}$
          minLength: 1
          maxLength: 12
          example: '0.7'
        contractIdentification:
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          description: Идентификатор для однозначного определения валютного контракта
          example: DOC441234-1234-1234
        quotationDate:
          description: Дата и время обменного курса
          allOf:
            - $ref: '#/components/schemas/ISODateTime'
      required:
        - sourceCurrency
        - exchangeRate
    AmountAndCurrencyExchangeDetails:
      description: Сумма денег  и информации об обменом курсе, подлежащая переводу между плательщиком и получателем денежных средств до вычета расходов, выраженная в валюте обозначенной инициирующей стороной в случае, если указанная сумма и/или валюта отличаются от суммы и/или валюты операции по счету
      type: object
      additionalProperties: false
      properties:
        Amount:
          description: Сумма денег, подлежащая переводу между плательщиком и получателем денежных средств до вычета расходов, выраженная в валюте обозначенной инициирующей стороной
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        CurrencyExchange:
          description: 'Набор элементов, используемые для указания информации об обменом курсе. Использование: Это может быть либо встречная сумма, указанная в сделке с иностранной валютой, либо результат информации о валюте, примененной к указанной сумме, до вычета расходов'
          allOf:
            - $ref: '#/components/schemas/CurrencyExchange'
          required:
            - Amount
    BankTransactionCode:
      description: Код банковской операции
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          description: Тип банковской операции
          example: '20'
        subCode:
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          description: Подтип банковской операции
          example: '20'
        issuer:
          type: string
          pattern: ^[\w\W]{1,35}$
          maxLength: 35
          example: RU.CBR
          description: Идентификация эмитента собственного банковского кода операции по счету
      required:
        - code
    LocalInstrumentCode:
      description: |
        (Номер реквизита 5) Вид платежного распоряжения.
        01 - в рамках расчетов платежными поручениями
        02 - в рамках расчетов в форме перевода денежных средств по требованию получателя средств (прямое дебетование)
        03 - в рамках расчетов с помощью денежных чеков
        04 - в рамках расчетов приходного кассового ордера или объявление на взнос наличными
        06 - в рамках расчетов инкассовыми поручениями
        09 - в рамках расчетов мемориальным ордером
        16 - при частичном исполнении
        17 - в рамках расчетов банковским ордером
      type: string
      maxLength: 35
      enum:
        - '01'
        - '02'
        - '03'
        - '04'
        - '06'
        - '09'
        - '16'
        - '17'
