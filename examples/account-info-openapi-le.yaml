    PostalAddress:
      description: Почтовый адрес
      type: object
      additionalProperties: false
      properties:
        addressType:
          description: Тип адреса
          allOf:
            - $ref: '#/components/schemas/AddressTypeCode'
          example: Postal
        addressLine:
          description: Строка адреса
          type: string
          pattern: ^[\w\W]{1,140}$
          minLength: 1
          maxLength: 140
          example: Адрес в виде строки
        streetName:
          description: Наименование улицы или проспекта
          type: string
          pattern: ^[\w\W]{1,70}$
          minLength: 1
          maxLength: 70
          example: Садовая
        buildingNumber:
          description: Номер, который определяет положение здания на улице
          type: string
          pattern: ^[\w\W]{1,16}$
          minLength: 1
          maxLength: 16
          example: '11'
        postCode:
          description: Почтовый индекс
          type: string
          pattern: ^[\w\W]{6,16}$
          minLength: 6
          maxLength: 16
          example: '0100010'
        townName:
          description: Наименование населённого пункта или территории, находящейся вне границ поселений
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: Бигсити
        countrySubDivision:
          description: Наименование и тип субъекта Российской Федерации
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: Мой край
        country:
          description: Название страны в кодированной форме
          allOf:
            - $ref: '#/components/schemas/CountryCode'
    PartyIdentification:
      description: Информация об участнике, используемая для идентификации юридического или физического лица
      type: object
      additionalProperties: false
      properties:
        name:
          description: Наименование организации или Ф.И.О.
          type: string
          pattern: ^[\w\W]{1,160}$
          minLength: 1
          maxLength: 160
          example: Наименование организации или физического лица
        mobileNumber:
          description: Номер мобильного телефона
          type: string
          pattern: ^\d{11,15}$
          example: '79206001010'
        countryOfResidence:
          description: Страна проживания
          allOf:
            - $ref: '#/components/schemas/CountryCode'
        countryOfBirth:
          description: Место рождения (страна)
          allOf:
            - $ref: '#/components/schemas/CountryCode'
        provinceOfBirth:
          description: Место рождения (область).
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: Ставропольский край
        cityOfBirth:
          description: Место рождения (город)
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: Ставрополь
        birthDate:
          description: Дата рождения
          allOf:
            - $ref: '#/components/schemas/ISODateTime'
        Identification:
          description: Идентификация юридического или физического лица.
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/IdentificationType'
          minItems: 1
        PostalAddress:
          $ref: '#/components/schemas/PostalAddress'
      required:
        - name
        - Identification
