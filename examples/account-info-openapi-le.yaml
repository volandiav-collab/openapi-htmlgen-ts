    TaxPeriod:
      description: Налоговый период
      type: object
      additionalProperties: false
      properties:
        year:
          description: Год, к которому относится налог
          type: string
          pattern: ^([1-9][0-9]{3}|0[0-9]{3})-01-01$
          example: '2021-01-01'
        type:
          description: Тип налогового периода (реквизит 107)
          allOf:
            - $ref: '#/components/schemas/TaxRecordPeriodCode'
          example: MM02
        fromDate:
          description: Дата уплаты налогового платежа
          allOf:
            - $ref: '#/components/schemas/ISODateTime'
        toDate:
          description: Дата уплаты налогового платежа
          allOf:
            - $ref: '#/components/schemas/ISODateTime'
    CBRFTaxRate:
      description: Процентная ставка НДС
      type: string
      pattern: ^\d{1,2}$
      example: '20'
    TaxAmount:
      description: Информация о НДС
      type: object
      additionalProperties: false
      properties:
        rate:
          description: Ставка НДС (Номер реквизита 14.3)
          allOf:
            - $ref: '#/components/schemas/CBRFTaxRate'
        totalAmount:
          description: Сумма НДС (Номер реквизита 14.4)
          allOf:
            - $ref: '#/components/schemas/ActiveCurrencyAndAmountSimpleType'
    TaxRecord:
      description: Дополнительные налоговые реквизиты
      type: object
      additionalProperties: false
      properties:
        type:
          description: Реквизит 110. Код выплат
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: '1234'
        category:
          description: Реквизит 106. Основание налогового платежа
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: TP
        categoryDetails:
          description: Код бюджетной классификации
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: '18210301000011000000'
        debtorStatus:
          description: Статус налогоплательщика
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: '13'
        Period:
          description: (Номер реквизита 14.2) Налоговый период
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TaxPeriod'
          minItems: 0
        TaxAmount:
          description: Информация о НДС
          allOf:
            - $ref: '#/components/schemas/TaxAmount'
    TaxInformation:
      description: Налоговая информация
      type: object
      additionalProperties: false
      properties:
        administrationZone:
          description: Реквизит 105. Код по Общероссийскому классификатору территорий муниципальных образований ОКТМО
          type: string
          maxLength: 11
          pattern: ^\d{1,11}$
          example: '45388000'
        referenceNumber:
          description: Реквизит 108. Номер налогового документа
          type: string
          pattern: ^[\w\W]{1,140}$
          minLength: 1
          maxLength: 140
          example: '120'
        date:
          description: Реквизит 109. Дата налогового документа
          allOf:
            - $ref: '#/components/schemas/ISODateTime'
        creditor:
          description: Налоговая информация о получателе средств
          allOf:
            - $ref: '#/components/schemas/TaxParty'
        debtor:
          description: Налоговая информация о плательщике
          allOf:
            - $ref: '#/components/schemas/TaxParty'
        Record:
          description: Дополнительные налоговые реквизиты
          allOf:
            - $ref: '#/components/schemas/TaxRecord'
    RemittanceInformation:
      description: Назначение платежа. Предоставляемая информация, позволяющая сопоставить запись с позициями, для которых предназначен перевод
      type: object
      additionalProperties: false
      properties:
        unstructured:
          description: Текстовое назначение платежа
          type: string
          pattern: ^[\w\W]{1,210}$
          minLength: 1
          maxLength: 210
          example: Назначение платежа - оплата за товары или услуги
        ReferredDocumentInformation:
          description: Информация о связанном документе. В первом повторении секции ReferredDocumentInformation указывается Дата составления распоряжения. По договоренности участников обмена могут быть указаны иные коды связанных документов в последующих повторениях секции ReferredDocumentInformation.
          type: array
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/ReferredDocumentInformation'
        CreditorReferenceInformation:
          description: Информация от получателя  денежных средств
          allOf:
            - $ref: '#/components/schemas/CreditorReferenceInformation'
        TaxRemittance:
          description: Информация о платеже, которая связана с оплатой налогов
          allOf:
            - $ref: '#/components/schemas/TaxInformation'
      required:
        - unstructured
    ReportEntry:
      description: Запись об операция по счету
      type: object
      additionalProperties: false
      properties:
        transactionIdentification:
          description: Уникальный и неизменный идентификатор, используемый для идентификации операции по счету
          type: string
          pattern: ^[a-zA-Z0-9-]{1,40}$
          minLength: 1
          maxLength: 40
          example: this-is-a-slug-format-transaction-id
        instructionIdentification:
          description: Уникальный идентификатор, присвоенный инструктирующей стороной для инструктируемой стороны для однозначного определения инструкции
          type: string
          pattern: ^[\w\W]{1,35}$
          minLength: 1
          maxLength: 35
          example: 12345-IID-001
        endtoendIdentification:
          description: Уникальный идентификатор, присвоенный инструктирующей стороной для инструктируемой стороны для однозначного определения инструкции
          type: string
          pattern: ^[\w\W]{1,40}$
          minLength: 1
          maxLength: 35
          example: 12345-EEID-001
        uetr:
          description: Указывается идентификатор, присваиваемый при передаче распоряжения с использованием системы SWIFT, в соответствии со стандартом RFC 4122 (IETF)
          type: string
          pattern: '[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}'
          minLength: 1
          maxLength: 36
          example: de2da6c9-18be-48d4-8053-867ed90a316a
        purpose:
          description: (Номер реквизита 15.5 Код вида дохода) Причина, по которой осуществляется платеж.
          allOf:
            - $ref: '#/components/schemas/PurposeCode'
        creditDebitIndicator:
          description: Определяет является ли операция дебетовая или кредитовая
          allOf:
            - $ref: '#/components/schemas/CreditDebitCode'
        status:
          description: Статус операции по счету
          allOf:
            - $ref: '#/components/schemas/TransactionStatusCode'
        bookingDateTime:
          description: Дата и время, когда запись об операции по счету публикуется на счете в бухгалтерской книге обслуживающей организации. Используется стандарт ISO8601
          type: string
          format: date-time
          example: '2023-12-15T00:00:00+00:00'
        valueDateTime:
          description: Дата и время, когда активы становятся доступными владельцу счета в случае ввода кредита или перестают быть доступными владельцу счета в случае ввода дебетовой операции по счету
          type: string
          format: date-time
          example: '2023-12-15T00:00:00+00:00'
        Amount:
          description: Информация о сумме и валюте операции по счету для данной записи (Примечание - TransactionAmount,ChargeAmount,InstructedAmount - это детали данного реквизита)
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        TransactionAmount:
          description: Сумма в валюте исходной операции по счету
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        ChargeAmount:
          description: Комиссия за операции по счету
          allOf:
            - $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        InstructedAmount:
          description: Сумма денег  и информации об обменом курсе, подлежащая переводу между плательщиком и получателем денежных средств до вычета расходов, выраженная в валюте обозначенной инициирующей стороной в случае, если указанная сумма и/или валюта отличаются от суммы и/или валюты операции по счету
          allOf:
            - $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
        BankTransactionCode:
          description: Подробная информация для полной идентификации собственного банковского кода операции по счету
          allOf:
            - $ref: '#/components/schemas/BankTransactionCode'
        PaymentTypeInformation:
          description: Информация о типе платежа
          allOf:
            - $ref: '#/components/schemas/PaymentTypeInformation'
        UltimateDebtor:
          description: Фактический плательщик
          allOf:
            - $ref: '#/components/schemas/PartyIdentification'
        Debtor:
          description: Плательщик
          allOf:
            - $ref: '#/components/schemas/PartyChoice'
        DebtorAgent:
          description: Финансовое организация, обслуживающая счет плательщика
          allOf:
            - $ref: '#/components/schemas/BranchAndFinancialInstitutionInformationShort'
        DebtorAgentAccount:
          description: Однозначная идентификация счета плательщика у обслуживающего его банка в платежной цепочке
          allOf:
            - $ref: '#/components/schemas/CashAccount'
        DebtorAccount:
          description: Уникальная идентификация счета плательщика, на котором будет сделана дебетовая запись в результате операции
          allOf:
            - $ref: '#/components/schemas/CashAccount'
        IntermediaryAgent:
          description: Банк-посредник, находящийся между банком плательщика и банком получателя  денежных средств
          allOf:
            - $ref: '#/components/schemas/BranchAndFinancialInstitutionInformationShort'
        IntermediaryAgentAccount:
          description: Счет банка-посредника
          allOf:
            - $ref: '#/components/schemas/CashAccount'
        CreditorAgent:
          description: Финансовое организация, обслуживающая счет получателя  денежных средств
          allOf:
            - $ref: '#/components/schemas/BranchAndFinancialInstitutionInformationShort'
        CreditorAccount:
          description: Идентификатор счета получателя средств, на котором будет проведена запись о кредите в результате операции
          allOf:
            - $ref: '#/components/schemas/CashAccount'
        CreditorAgentAccount:
          description: Однозначная идентификация счета банка получателя денежных средств у обслуживающего его банка, по которому будет выполнена кредитовая запись в результате платежной операции
          allOf:
            - $ref: '#/components/schemas/CashAccount'
        Creditor:
          description: Получатель денежных средств
          allOf:
            - $ref: '#/components/schemas/PartyChoice'
        UltimateCreditor:
          description: Фактический получатель денежных средств
          allOf:
            - $ref: '#/components/schemas/PartyIdentification'
        CardTransaction:
          description: |-
            Предоставляет данные по карте (номер, платежная система), терминалу
              (номер, идентификатор) и транзакционные данные, используемые для
              уникальной идентификации операции по карте
          allOf:
            - $ref: '#/components/schemas/CardTransaction18'
        RemittanceInformation:
          description: Предоставляемая информация, позволяющая сопоставить запись с позициями, для которых предназначен перевод, такими как коммерческие счета в системе дебиторской задолженности
          allOf:
            - $ref: '#/components/schemas/RemittanceInformation'
      required:
        - status
        - bookingDateTime
        - Amount
