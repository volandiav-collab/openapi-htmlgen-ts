         <ul>
           <li>URGP - Срочный</li>
           <li>NURG - Не срочный</li>
         </ul>
      type: string
      enum:
        - URGP
        - NURG
      x-enum-descriptions:
        - Срочный
        - Не срочный
      x-enum-varnames:
