" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="207" y="154.4561">1</text><text fill="#00008B" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187" x="218" y="154.4561">Установка соединения TLS MA</text><polygon fill="#181818" points="584,202.0156,594,206.0156,584,210.0156,588,206.0156" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="190" x2="590" y1="206.0156" y2="206.0156"/><text fill="#00008B" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="197" y="192.9834">2</text><text fill="#00008B" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="376" x="208" y="184.8076">Аутентификация Client Credentials и получение токена доступа</text><text fill="#00008B" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310" x="208" y="201.1592">POST /token (client_assertion scope: medicalservice)</text><polygon fill="#181818" points="201,232.3672,191,236.3672,201,240.3672,197,236.3672" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="195" x2="600" y1="236.3672" y2="236.3672"/><text fill="#00008B" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="207" y="231.5107">3</text><text fill="#00008B" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169" x="218" y="231.5107">: access-token, refresh-token</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1.0;" width="739.5" x="0" y="265.543"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="739.5" y1="265.543" y2="265.543"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="739.5" y1="268.543" y2="268.543"/><rect fill="#EEEEEE" height="24.3516" style="stroke:#000000;stroke-width:2.0;" width="579" x="80.25" y="254.3672"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="561" x="86.25" y="271.8623">Шаг 2: Получение информации об услугах медицинской организации (прейскуранте)</text><polygon fill="#181818" points="201,307.0703,191,311.0703,201,315.0703,197,311.0703" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="685.5,307.0703,695.5,311.0703,685.5,315.0703,689.5,311.0703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="195" x2="691.5" y1="311.0703" y2="311.0703"/><text fill="#00008B" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="207" y="306.2139">4</text><text fill="#00008B" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187" x="218" y="306.2139">Установка соединения TLS MA</text><polygon fill="#181818" points="680.5,353.7734,690.5,357.7734,680.5,361.7734,684.5,357.7734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="190" x2="686.5" y1="357.7734" y2="357.7734"/><text fill="#00008B" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="197" y="344.7412">5</text><text fill="#00008B" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373" x="208" y="336.5654">Получение информации об услугах медицинской организации</text><text fill="#00008B" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346" x="208" y="352.917">GET /medical-services (Authorization: Bearer access-token)</text><polygon fill="#181818" points="201,384.125,191,388.125,201,392.125,197,388.125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="195" x2="696.5" y1="388.125" y2="388.125"/><text fill="#00008B" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="207" y="383.2686">6</text><text fill="#00008B" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="421" x="218" y="383.2686">: Информация об услугах медицинской организации (MedicalService[])</text><rect fill="none" height="25.1563" id="_title" style="stroke:none;stroke-width:1.0;" width="532" x="103.25" y="401.125"/><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="3" x="367.75" y="411.5059"> </text><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="529" x="106.25" y="424.084">Рисунок 1. Диаграмма последовательности получения информации об услугах медицинской организации</text><!--MD5=[b7c0fea8e80786d052979c33ad33fe41]
@startuml medical-service
autoactivate on
footer \n Рисунок 1. Диаграмма последовательности получения информации об услугах медицинской организации
skinparam ArrowFontColor DarkBlue
skinparam UsecaseFontStyle bold
skinparam PackageFontStyle bold
skinparam PackageBackgroundColor white
skinparam SequenceBoxFontColor black
skinparam SequenceGroupBackgroundColor white
skinparam SequenceGroupBodyBackgroundColor none
skinparam SequenceGroupHeaderFontColor black
hide footbox


actor Пользователь as PSU
participant "Страховая компания" as TPP
box "Медицинская организация" 
participant "Сервер\nавторизации" as СА 
participant "Сервер\nресурсов" as RS
end box
autonumber 1

== Шаг 1: Получение токена доступа ==

TPP <- -> СА: Установка соединения TLS MA

TPP -> СА: Аутентификация Client Credentials и получение токена доступа\nPOST /token (client_assertion scope: medicalservice)
return: access-token, refresh-token

== Шаг 2: Получение информации об услугах медицинской организации (прейскуранте) ==
TPP <- -> RS: Установка соединения TLS MA
TPP -> RS: Получение информации об услугах медицинской организации \nGET /medical-services (Authorization: Bearer access-token)
return: Информация об услугах медицинской организации (MedicalService[])

@enduml

